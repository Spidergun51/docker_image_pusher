name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
      - name: Before freeing up disk space
        run: |
          echo "初始磁盘状态:"
          df -hT

      # 扩容磁盘，清理无用预装组件
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'
          remove-codeql: 'true'
          # 注释掉之前导致containerd目录不在扩容盘的配置
          # build-mount-path: '/var/lib/docker/'

      - name: Restart docker
        run: sudo service docker restart

      - name: 扩容后磁盘状态
        run: df -hT

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: 拉取镜像并转存阿里云
        run: |
          set -e
          docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY
          
          # 逐行读取images.txt，跳过空行和注释
          while IFS= read -r line || [ -n "$line" ]; do
            # 跳过空行和注释行
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            
            echo "==== 开始处理镜像: $line ===="
            # 安静模式拉取，减少日志量避免写爆/home分区
            docker pull --quiet "$line"
            
            # 解析镜像名，拼接阿里云目标地址
            image_name_tag=$(echo "$line" | awk -F'/' '{print $NF}')
            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$image_name_tag"
            
            echo "打标签: $line -> $new_image"
            docker tag "$line" "$new_image"
            
            echo "推送到阿里云: $new_image"
            docker push "$new_image"
            
            # 推完立刻删本地镜像释放空间
            docker rmi "$line" "$new_image" >/dev/null
            echo "==== 镜像 $line 处理完成 ===="
            df -hT
          done < images.txt
